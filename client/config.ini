[GateServer]
host=127.0.0.1
port=8080

[WebRTC]
; STUN server URI used for ICE negotiation.
; Change this if stun.l.google.com is unreachable (e.g. in China use coturn or another STUN).
stun_server=stun:stun.l.google.com:19302
; TURN relay server used when direct P2P fails.
; Example: turn:your-domain:3478?transport=udp
turn_server=
turn_username=
turn_password=

[TCP]
; Heartbeat interval in milliseconds (default: 30000)
heartbeat_ms=30000
; Pong timeout in milliseconds - disconnect if no pong received (default: 10000)
pong_timeout_ms=10000
; Maximum reconnect backoff in seconds (default: 30)
max_backoff_sec=30
